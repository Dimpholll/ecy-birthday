<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wishing Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Poppins:wght@800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; }
  body {
    display: flex; flex-direction: column;
    font-family: 'Cormorant Garamond', Georgia, serif; color: #fff;
  }
  .stage { position: relative; flex: 1; min-height: 0; }
  #tree { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; touch-action: manipulation; }
  .controls { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 4px 6px 2px; }
  .hint { font-weight: 600; font-size: 15px; font-style: italic; line-height: 1.2; }
  .again {
    border: 1.5px solid #fff; background: transparent; color: #fff; cursor: pointer; white-space: nowrap;
    padding: 6px 16px; border-radius: 999px; font: 600 15px 'Cormorant Garamond', serif;
    transition: background .2s, color .2s;
  }
  .again:hover, .again:focus-visible { background: #fff; color: #df3d5e; outline: none; }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="tree" aria-label="A heart-shaped tree. Tap the hearts to make a wish."></canvas>
  </div>
  <div class="controls">
    <span class="hint" id="hint">Tap the hearts to make a wish ♡</span>
    <button class="again" id="again" type="button">Grow again</button>
  </div>

<script>
(() => {
  const cv = document.getElementById('tree');
  const ctx = cv.getContext('2d');
  const stage = document.getElementById('stage');
  const hint = document.getElementById('hint');

  const LEAF_COLORS = ['#ffb3d1', '#ff8fc0', '#f9a8cf', '#ffd6e7', '#ffe27a', '#ffc94d', '#ffb36b', '#ff9f80', '#ffa6c9'];
  const TEXT_COLORS = ['#fff3f8', '#ffd6e7', '#ffe27a', '#ffc94d', '#ffb3d1', '#ffffff'];
  const TRUNK = '#5b2540';
  const WISHES = ['Wish made ♡', 'Your wish is on its way ✨', 'May it come true ♡', 'Wish sent, now believe it ♡'];

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOutBack = t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

  let W, H, dpr, S, CX, CT, GROUND;
  let leaves = [], branches = [], targets = [], drops = [], ambient = [], parts = [];
  let g = 0, last = 0, dropsStarted = false, dropStart = 0, nextAmb = 0, wishCount = 0;

  /* ---------- drawing helpers ---------- */
  function heartPath(s) {
    ctx.beginPath();
    ctx.moveTo(0, -s * .25);
    ctx.bezierCurveTo(0, -s * .55, -s * .5, -s * .55, -s * .5, -s * .15);
    ctx.bezierCurveTo(-s * .5, s * .15, -s * .1, s * .3, 0, s * .5);
    ctx.bezierCurveTo(s * .1, s * .3, s * .5, s * .15, s * .5, -s * .15);
    ctx.bezierCurveTo(s * .5, -s * .55, 0, -s * .55, 0, -s * .25);
    ctx.closePath();
  }
  function drawHeart(x, y, s, rot, color, alpha = 1) {
    const c = Math.cos(rot), n = Math.sin(rot);
    ctx.setTransform(c * dpr, n * dpr, -n * dpr, c * dpr, x * dpr, y * dpr);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    heartPath(s);
    ctx.fill();
  }
  function bez(p0, p1, p2, p3, n = 36) {
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n, m = 1 - t;
      pts.push({
        x: m*m*m*p0.x + 3*m*m*t*p1.x + 3*m*t*t*p2.x + t*t*t*p3.x,
        y: m*m*m*p0.y + 3*m*m*t*p1.y + 3*m*t*t*p2.y + t*t*t*p3.y
      });
    }
    return pts;
  }
  function drawBranch(b) {
    const k = clamp((g - b.a) / (b.b - b.a));
    if (k <= 0) return;
    const n = Math.max(1, Math.floor(k * (b.pts.length - 1)));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = TRUNK;
    ctx.lineCap = 'round';
    for (let i = 1; i <= n; i++) {
      ctx.lineWidth = lerp(b.w0, b.w1, i / (b.pts.length - 1));
      ctx.beginPath();
      ctx.moveTo(b.pts[i - 1].x, b.pts[i - 1].y);
      ctx.lineTo(b.pts[i].x, b.pts[i].y);
      ctx.stroke();
    }
  }

  /* ---------- scene building ---------- */
  // Heart-shaped region: (x²+y²-1)³ - x²y³ <= 0   (x ∈ ±1.14, y ∈ -1 … 1.2)
  const insideHeart = (x, y) => { const a = x*x + y*y - 1; return a*a*a - x*x*y*y*y <= 0; };
  const P = (ux, uy) => ({ x: CX + ux * S, y: CT + (1.2 - uy) * S });   // heart units → pixels

  function buildTree() {
    // The canopy is sized from the stage width AND height, so it can never be clipped.
    S = Math.min(W * 0.88 / 2.28, H * 0.5 / 2.2);
    CX = W / 2;
    CT = H * 0.035;
    GROUND = H * 0.725;

    const fork = { x: CX, y: CT + 1.95 * S };
    const base = { x: CX, y: GROUND };
    branches = [];
    const add = (pts, w0, w1, a, b) => branches.push({ pts, w0, w1, a, b });

    add(bez(base, { x: CX + .05*S, y: GROUND - (GROUND-fork.y)*.35 }, { x: CX - .06*S, y: GROUND - (GROUND-fork.y)*.7 }, fork), S*.115, S*.07, 0, .32);

    [-1, 1].forEach(d => {
      const p3 = P(.72*d, .55);
      add(bez(fork, P(.08*d, -.45), P(.55*d, -.25), p3), S*.07, S*.025, .22, .52);
      add(bez(p3, P(.85*d, .8), P(1.0*d, .62), P(1.02*d, .95)), S*.03, S*.012, .45, .62);
      add(bez(p3, P(.7*d, .85), P(.55*d, 1.0), P(.46*d, 1.12)), S*.028, S*.01, .47, .64);
      add(bez(p3, P(.55*d, .3), P(.4*d, .1), P(.3*d, .0)), S*.025, S*.01, .45, .6);
      add(bez(P(.2*d, -.2), P(.18*d, -.1), P(.22*d, .1), P(.3*d, .3)), S*.025, S*.01, .4, .58);
    });
    // middle branch so the middle of the canopy is supported too
    add(bez(fork, P(0, -.4), P(-.04, -.1), P(0, .25)), S*.05, S*.02, .25, .5);
    add(bez(P(0, .02), P(.06, .15), P(.12, .3), P(.14, .52)), S*.02, S*.008, .5, .64);
    add(bez(P(0, .02), P(-.06, .15), P(-.12, .3), P(-.14, .52)), S*.02, S*.008, .5, .64);

    // canopy hearts — dart-throwing so they are evenly packed, middle included
    leaves = [];
    const r = Math.max(9, S * .072);
    const cell = r, grid = new Map();
    const key = (x, y) => Math.floor(x / cell) + ',' + Math.floor(y / cell);
    for (let i = 0; i < 14000; i++) {
      const ux = rand(-1.15, 1.15), uy = rand(-1, 1.2);
      if (!insideHeart(ux, uy)) continue;
      const p = P(ux, uy);
      const gx = Math.floor(p.x / cell), gy = Math.floor(p.y / cell);
      let ok = true;
      for (let a = -1; a <= 1 && ok; a++) for (let b = -1; b <= 1 && ok; b++) {
        const arr = grid.get((gx + a) + ',' + (gy + b));
        if (arr) for (const q of arr) if ((q.x - p.x) ** 2 + (q.y - p.y) ** 2 < r * r) { ok = false; break; }
      }
      if (!ok) continue;
      const leaf = {
        x: p.x, y: p.y, size: rand(r * 1.55, r * 2.3), rot: rand(-.6, .6),
        color: LEAF_COLORS[Math.floor(Math.random() * LEAF_COLORS.length)],
        ph: rand(0, 6.28), popT: -1,
        appear: clamp(0.3 + 0.58 * (1 - (p.y - CT) / (2.2 * S)) + rand(0, .06), 0, .92)
      };
      leaves.push(leaf);
      const k = key(p.x, p.y);
      if (!grid.has(k)) grid.set(k, []);
      grid.get(k).push(leaf);
    }
    leaves.sort((a, b) => a.appear - b.appear);
  }

  // Sample the greeting into heart positions
  function buildTargets() {
    const lines = W < 520 ? ['HAPPY', 'BIRTHDAY', 'My Adi'] : ['HAPPY BIRTHDAY', 'My Adi'];
    const caps = lines.length === 2 ? [H * .085, H * .115] : [H * .07, H * .07, H * .095];
    const off = document.createElement('canvas');
    off.width = W; off.height = H;
    const o = off.getContext('2d');
    o.fillStyle = '#000';
    o.textAlign = 'center';
    o.textBaseline = 'middle';
    const font = px => `800 ${px}px Poppins, "Arial Black", Impact, sans-serif`;

    let step = 6, minFs = 999;
    lines.forEach((t, i) => {
      o.font = font(100);
      const m = o.measureText(t).width;
      const fs = Math.min(100 * W * .9 / m, caps[i]);
      minFs = Math.min(minFs, fs);
      const y = H * (0.785 + (i + .5) * (0.2 / lines.length));
      o.font = font(fs);
      o.fillText(t, W / 2, y);
    });
    step = Math.max(5, minFs * .115);

    const data = o.getImageData(0, 0, W, H).data;
    targets = [];
    for (let y = step / 2; y < H; y += step) {
      for (let x = step / 2; x < W; x += step) {
        if (data[((y | 0) * W + (x | 0)) * 4 + 3] > 110) {
          targets.push({ x: x + rand(-.6, .6), y: y + rand(-.6, .6), line: y < H * (.785 + .2 / lines.length) ? 0 : 1, size: step * 1.4 });
        }
      }
    }
    // roughly write it out left→right, line by line
    targets.sort((a, b) => (a.line - b.line) || ((a.x + rand(-W*.05, W*.05)) - (b.x + rand(-W*.05, W*.05))));
  }

  function startDrops(now, instant) {
    dropsStarted = true;
    dropStart = now + (instant ? -60000 : 500);
    const interval = Math.min(14, 8000 / Math.max(1, targets.length));
    drops = targets.map((t, i) => {
      const src = leaves[Math.floor(Math.random() * leaves.length)];
      const dur = rand(1300, 2000) + (t.y - src.y) / H * 1000;
      return {
        x0: src.x, y0: src.y, tx: t.x, ty: t.y, size: t.size,
        color: TEXT_COLORS[Math.floor(Math.random() * TEXT_COLORS.length)],
        t0: dropStart + i * interval, dur, sway: rand(10, 34), ph: rand(0, 6.28),
        rot0: rand(-1, 1), pulse: rand(0, 6.28)
      };
    });
  }

  function build(instant) {
    const r = stage.getBoundingClientRect();
    W = Math.max(300, Math.floor(r.width));
    H = Math.max(360, Math.floor(r.height));
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = W * dpr; cv.height = H * dpr;
    buildTree();
    buildTargets();
    parts = []; ambient = []; drops = []; dropsStarted = false;
    if (instant) { g = 1; startDrops(performance.now(), true); } else { g = 0; }
  }

  /* ---------- interaction ---------- */
  cv.addEventListener('pointerdown', e => {
    const rect = cv.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (W / rect.width);
    const y = (e.clientY - rect.top) * (H / rect.height);
    const now = performance.now();
    let best = null, bd = Infinity;
    for (const l of leaves) {
      if (g < 1 || (l.popT > 0 && now - l.popT < 1500)) continue;
      const d = Math.hypot(l.x - x, l.y - y);
      if (d < l.size * .75 && d < bd) { bd = d; best = l; }
    }
    if (!best) return;
    best.popT = now;
    wishCount++;
    hint.textContent = WISHES[(wishCount - 1) % WISHES.length];
    parts.push({ x: best.x, y: best.y, vx: 0, vy: -70, life: 2400, max: 2400, size: best.size * 1.5, color: '#fff3f8', rot: 0, wish: true });
    for (let i = 0; i < 8; i++) {
      const a = rand(0, Math.PI * 2), v = rand(40, 110);
      parts.push({ x: best.x, y: best.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, life: 900, max: 900, size: rand(5, 9), color: best.color, rot: rand(-1, 1) });
    }
  });

  document.getElementById('again').addEventListener('click', () => {
    hint.textContent = 'Tap the hearts to make a wish ♡';
    leaves.forEach(l => (l.popT = -1));
    build(false);
  });

  /* ---------- animation ---------- */
  function frame(now) {
    const dt = Math.min(50, now - (last || now));
    last = now;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha = 1;
    ctx.clearRect(0, 0, W, H);

    if (g < 1) g = Math.min(1, g + dt / 4200);

    // ground shadow
    ctx.fillStyle = 'rgba(90, 20, 50, .22)';
    ctx.beginPath();
    ctx.ellipse(CX, GROUND + 2, S * .5 * clamp(g * 3), S * .045, 0, 0, Math.PI * 2);
    ctx.fill();

    branches.forEach(drawBranch);

    // canopy
    for (const l of leaves) {
      let k = clamp((g - l.appear) / .09);
      if (k <= 0) continue;
      let sc = easeOutBack(k);
      if (l.popT > 0) {
        const q = (now - l.popT) / 5000;
        if (q < 1) sc *= q < .15 ? 0 : easeOutBack(clamp((q - .15) / .5));
        else l.popT = -1;
      }
      if (sc <= 0.01) continue;
      const sw = Math.sin(now / 900 + l.ph) * 1.2 * clamp(g);
      drawHeart(l.x + sw, l.y + Math.cos(now / 1100 + l.ph) * .8, l.size * sc, l.rot + sw * .02, l.color);
    }

    // start the greeting when the tree is fully grown
    if (g >= 1 && !dropsStarted) startDrops(now, false);

    // hearts dropping into the greeting
    let allLanded = dropsStarted;
    for (const d of drops) {
      const p = (now - d.t0) / d.dur;
      if (p <= 0) { allLanded = false; continue; }
      let x, y, s = d.size, rot = 0;
      if (p >= 1) {
        x = d.tx; y = d.ty; s *= 1 + .07 * Math.sin(now / 520 + d.pulse);
      } else {
        allLanded = false;
        const ex = p * p * (3 - 2 * p);
        x = lerp(d.x0, d.tx, ex) + Math.sin(p * Math.PI * 2 + d.ph) * d.sway * (1 - p);
        y = lerp(d.y0, d.ty, Math.pow(p, 1.6));
        rot = d.rot0 * (1 - p);
        s *= lerp(.6, 1, p);
      }
      drawHeart(x, y, s, rot, d.color);
    }

    // once the greeting is written, loose leaves keep drifting down
    if (allLanded && now > nextAmb && leaves.length) {
      nextAmb = now + rand(500, 900);
      const src = leaves[Math.floor(Math.random() * leaves.length)];
      ambient.push({ x: src.x, y: src.y, vx: rand(-8, 8), vy: rand(30, 50), rot: src.rot, vr: rand(-1, 1), size: src.size * .85, color: src.color, ph: rand(0, 6.28), life: 0, max: (GROUND - src.y) / 40 * 1000 });
    }
    for (let i = ambient.length - 1; i >= 0; i--) {
      const a = ambient[i];
      a.life += dt;
      a.x += (a.vx + Math.sin(a.life / 400 + a.ph) * 18) * dt / 1000;
      a.y += a.vy * dt / 1000;
      a.rot += a.vr * dt / 1000;
      const al = clamp(1 - a.life / a.max);
      if (al <= 0) { ambient.splice(i, 1); continue; }
      drawHeart(a.x, a.y, a.size, a.rot, a.color, al);
    }

    // wish hearts + sparkles
    for (let i = parts.length - 1; i >= 0; i--) {
      const q = parts[i];
      q.life -= dt;
      if (q.life <= 0) { parts.splice(i, 1); continue; }
      q.x += q.vx * dt / 1000;
      q.y += q.vy * dt / 1000;
      if (!q.wish) q.vy += 140 * dt / 1000;
      drawHeart(q.x, q.y, q.size, q.rot, q.color, clamp(q.life / q.max * (q.wish ? 1.4 : 1)));
    }

    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  /* ---------- start ---------- */
  let resizeTimer;
  new ResizeObserver(() => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => build(g >= 1), 150);
  }).observe(stage);

  const ready = (document.fonts && document.fonts.load) ? document.fonts.load('800 40px Poppins').catch(() => {}) : Promise.resolve();
  ready.then(() => { build(false); requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
